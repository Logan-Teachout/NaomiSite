<html>



<head>

    <meta charset="UTF-8">

    rel="stylesheet" type="text/css">

</head>

<body>

    <!-- Header -->

    <div class="heady">

        <div class="headylogo">
            <img src="images/logo.png" alt="">
        </div>

        <div class="headyfind">
            <a class="headytag" href="index.html"> HOME </a>
        </div>

        <div class="headyfind">
            <a class="headytag" href="works.html"> WORKS </a>
        </div>

        <div class="headyfind">
            <a class="headytag" href="about.html"> ABOUT </a>
        </div>

        <div class="headyfind">

        </div>

        <div class="headyinsta">
            <a href="https://www.instagram.com/naomisantoki/">
            <img src="images/insta.png" alt="">
            </a>
        </div>

    </div>

    <!-- Body Gallery -->
    <div class="bodypot">

        <!-- 
        Use these h3 tags to break apart with titles
        -->
        <h3 class="TOHT"> 2025 </h3>

        <!-- 
        Then just copy this style and fill in the images as with the home page,
        and use the image as the data-img and then put your title in data-title.
        -->
        <div class="gallery">

            <button class="piece" data-img="images/RoadtoBruma.jpg" data-title="Title">
                <img src="images/RoadtoBruma.jpg" alt="">
            </button>

            <button class="piece" data-img="images/RoadtoBruma.jpg" data-title="Title">
                <img src="images/RoadtoBruma.jpg" alt="">
            </button>

            <button class="piece" data-img="images/RoadtoBruma.jpg" data-title="Title">
                <img src="images/RoadtoBruma.jpg" alt="">
            </button>

            <button class="piece" data-img="images/RoadtoBruma.jpg" data-title="Title">
                <img src="images/RoadtoBruma.jpg" alt="">
            </button>

        </div>

        <h3 class="TOHT"> 2024 </h3>

        <div class="gallery">

            <button class="piece" data-img="images/RoadtoBruma.jpg" data-title="Title">
                <img src="images/RoadtoBruma.jpg" alt="">
            </button>

            <button class="piece" data-img="images/Works_2024/Works_FishingandGraduating2024.jpg" data-title="<span class="italian">Fishing and Graduating,</span> 2025, Oil on canvas, 48 x 36 in.">
                <img src="images/Works_2024/Works_FishingandGraduating2024.jpg" alt="">
            </button>

        </div>

    </div>

    <!-- Do not touch this bc it's scripting and you don't need to change it -->
    <!-- Scripting -->

      <div class="lightbox" id="lightbox">
    <div class="lightbox-content">
      <img id="lightbox-img" src="" alt="">
      <p id="lightbox-caption"></p>
    </div>
  </div>
  
  <script>
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const lightboxCaption = document.getElementById('lightbox-caption');
  
    document.querySelectorAll('.piece').forEach(button => {
      button.addEventListener('click', () => {
        const imgSrc = button.getAttribute('data-img');
        const caption = button.getAttribute('data-title');
  
        lightboxImg.src = imgSrc;
        lightboxCaption.textContent = caption;
        lightbox.classList.add('show');
      });
    });
  
    lightbox.addEventListener('click', () => {
      lightbox.classList.remove('show');
    });
  </script>
    
</body>
